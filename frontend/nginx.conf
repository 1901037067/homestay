server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 hash 路由（#/calendar 这种），刷新任何路径都只会请求 /，所以不需要复杂的 rewrite；
    # 但保留 try_files 兜底，将来若换 history 模式也不必改这里
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到后端容器。proxy_pass 结尾不带 URI，路径原样透传（/api/... → 后端 /api/...）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # session 是 cookie 鉴权，后端不跨域，这里不需要额外处理 CORS
        proxy_read_timeout 60s;
    }

    # 静态资源带 hash，可以长缓存；index.html 不能缓存，否则发版后前端还是旧的
    location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
