name: CI

# 实施计划 W8 那句"自研压测台可复现、可进 CI"要靠这个文件兑现。
# 刻意不在任务名里写测试条数 —— 这个数字已经过期过两次（见 docs/交接.md 第 6 节）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（真 MySQL，Testcontainers）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 本地用 -o（离线，走阿里云镜像）；CI 的 runner 没有那个本地仓库，必须联网取依赖
      - name: mvn test
        run: mvn -B --no-transfer-progress test

      # 压测/对照类的失败只有看得到断言现场才判断得了是不是环境抖动
      - name: 上传 surefire 报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
